name: Apply portfolio design tweak

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tweak:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inspect target markup
        run: |
          python - <<'PY'
          import re
          html = open("index.html", encoding="utf-8").read()
          terms = [
              "Years of continuous learning", "C++", "Python", "SQL",
              "Pandas", "NumPy", "Data Visualization", "Linux", "Networking"
          ]
          for term in terms:
              print("\n=== "+term+" ===")
              for m in list(re.finditer(re.escape(term), html, re.I))[:5]:
                  a=max(0,m.start()-700); b=min(len(html),m.end()+900)
                  print(html[a:b])
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Tweak experience and skills design [skip ci]"
            git push
          fi
