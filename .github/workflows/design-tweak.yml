name: Apply portfolio design tweak

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tweak:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update design
        run: |
          python - <<'PY'
          import re

          path = "index.html"
          html = open(path, encoding="utf-8").read()

          experience = "Years of continuous learning, hands-on projects, and growing experience across software engineering, data analysis, and cybersecurity."
          replacement = (
              '<div class="experience-inline" style="display:flex;align-items:center;gap:14px;'
              'margin-top:20px;line-height:1.5;background:transparent!important;border:none!important;'
              'box-shadow:none!important;padding:0!important;">'
              '<strong style="font-size:2.2rem;font-weight:800;">2+</strong><span style="font-size:.95rem;">' + experience + '</span></div>'
          )

          # Replace the top skill pills with the existing experience content, but without the card/box styling.
          skill_open = '<div class="skill-strip" aria-label="Core skills">'
          skill_start = html.find(skill_open)
          if skill_start < 0:
              raise SystemExit("Top skill strip not found")
          skill_end = html.find('</div>', skill_start)
          if skill_end < 0:
              raise SystemExit("Top skill strip closing tag not found")
          skill_end += len('</div>')
          html = html[:skill_start] + replacement + html[skill_end:]

          # Hide the old boxed experience strip; the new inline experience above is the only visible version.
          html = re.sub(
              r'<div class="experience-strip[^>]*>',
              '<div class="experience-strip" style="display:none!important">',
              html,
          )

          # Hide the lower Skills section, including all of its skill panels/tags.
          old_skills_open = '<section id="skills">'
          new_skills_open = '<section id="skills" style="display:none!important">'
          assert old_skills_open in html, "Skills section was not found"
          html = html.replace(old_skills_open, new_skills_open, 1)

          assert "2+ Years of continuous learning" in html
          assert 'class="skill-strip"' not in html

          open(path, "w", encoding="utf-8").write(html)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Move experience into hero and remove skills section [skip ci]"
            git push
          fi
